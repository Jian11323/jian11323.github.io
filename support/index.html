<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支持我们 · Jian Project</title>
  <meta name="description" content="支持 Jian Project：微信、支付宝赞助与爱发电。">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.cn">
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
  <link href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" onerror="this.onerror=null;this.href=this.href.replace('://fonts.googleapis.cn/','://fonts.font.im/')">
  <style>
    :root {
      --ink: #1a2332;
      --ink-soft: #4a5568;
      --mist: #eef3f4;
      --teal: #1a9b8e;
      --teal-deep: #147f74;
      --sand-deep: #c4a574;
      --shadow: 0 18px 40px rgba(26, 35, 50, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Noto Sans SC", Sora, sans-serif;
      color: var(--ink);
      background: #eef3f4;
      overflow-x: hidden;
    }
    .atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
      background: radial-gradient(ellipse 90% 70% at 50% 42%, #ffffff 0%, var(--mist) 68%, #e4ecee 100%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(48px);
    }
    .orb-a {
      width: min(52vw, 420px); height: min(52vw, 420px);
      left: -6%; top: -10%;
      background: rgba(26, 155, 142, 0.26);
    }
    .orb-b {
      width: min(44vw, 380px); height: min(44vw, 380px);
      right: -8%; bottom: 8%;
      background: rgba(196, 165, 116, 0.22);
    }
    .page {
      position: relative; z-index: 1;
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(36px, 8vh, 72px) 0 48px;
    }
    .back {
      display: inline-flex; align-items: center; gap: 8px;
      margin-bottom: 28px;
      color: var(--ink-soft); text-decoration: none; font-size: 0.92rem; font-weight: 500;
    }
    .back:hover { color: var(--teal-deep); }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .hero-heart {
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 10px;
      filter: drop-shadow(0 8px 16px rgba(225, 112, 85, 0.28));
    }
    .hero h1 {
      font-family: Sora, "Noto Sans SC", sans-serif;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .hero p {
      color: var(--ink-soft);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 34em;
      margin: 0 auto;
    }
    .pay-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 28px 0 20px;
    }
    .pay-card {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px 20px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .pay-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--ink);
    }
    .pay-card img {
      width: min(100%, 220px);
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
      border: 1px solid rgba(26, 35, 50, 0.06);
      padding: 8px;
    }
    .afdian {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 999px;
      border: none;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      font-family: inherit;
      background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
      box-shadow: 0 12px 28px rgba(26, 155, 142, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .afdian:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(26, 155, 142, 0.34);
    }
    .afdian svg {
      width: 20px; height: 20px; fill: currentColor;
    }
    .thanks {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 20px 24px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .thanks h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .thanks p {
      color: var(--ink-soft);
      font-size: 0.92rem;
      line-height: 1.7;
    }
    .foot {
      margin-top: 28px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--ink-soft);
    }
    .foot a { color: var(--teal-deep); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    @media (max-width: 560px) {
      .pay-grid { grid-template-columns: 1fr; }
      .pay-card img { width: min(100%, 260px); }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
  </div>
  <main class="page">
    <a class="back" href="/">← 返回 API 入口</a>
    <header class="hero">
      <div class="hero-heart" aria-hidden="true">❤️</div>
      <h1>支持我们</h1>
      <p>如果 Jian Project 提供的服务对您有帮助，可以考虑请我们喝杯咖啡 ☕<br>您的支持是我们持续维护和开发新功能的最大动力！</p>
    </header>

    <section class="pay-grid" aria-label="赞助方式">
      <article class="pay-card">
        <h2>微信支付</h2>
        <img src="/assets/sponsor/donate_wechat.png" width="220" height="220" alt="微信赞助">
      </article>
      <article class="pay-card">
        <h2>支付宝</h2>
        <img src="/assets/sponsor/donate_alipay.png" width="220" height="220" alt="支付宝赞助">
      </article>
    </section>

    <a class="afdian" href="https://afdian.com/a/jianproject" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-14h-7l0-6z"/></svg>
      在爱发电支持我
    </a>

    <section class="thanks" aria-label="鸣谢">
      <h2><span aria-hidden="true">✨</span> 鸣谢名单</h2>
      <p>感谢每一位通过微信、支付宝与爱发电支持本项目的朋友。<br>名单将在后续整理后陆续展示。</p>
    </section>

    <p class="foot">
      <a href="/">Jian Project</a>
      ·
      <a href="/">API 入口</a>
    </p>
  </main>
</body>
</html>
